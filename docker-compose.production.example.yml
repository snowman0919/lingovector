services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "port=${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - lingovector-postgres-prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p \"$${POSTGRES_PORT:-5432}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:${POSTGRES_PORT:-5432}"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${LINGOVECTOR_ENV_FILE:-.env.production}
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lingovector-storage:/app/storage
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${API_PORT:-8080}/health\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?set NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_DIAGNOSTICS_ENABLED: ${NEXT_PUBLIC_DIAGNOSTICS_ENABLED:-false}
        NEXT_PUBLIC_TTS_MODE: ${NEXT_PUBLIC_TTS_MODE:-server}
        NEXT_PUBLIC_SUPERTONIC_ONNX_MODEL_URL: ${NEXT_PUBLIC_SUPERTONIC_ONNX_MODEL_URL:-/models/supertonic/model.onnx}
        NEXT_PUBLIC_SUPERTONIC_ONNX_CONFIG_URL: ${NEXT_PUBLIC_SUPERTONIC_ONNX_CONFIG_URL:-}
    env_file:
      - ${LINGOVECTOR_ENV_FILE:-.env.production}
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
      PORT: ${WEB_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:${WEB_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.WEB_PORT || process.env.PORT || '3000')).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  lingovector-postgres-prod:
  lingovector-storage:
