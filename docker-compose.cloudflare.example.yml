# Optional Cloudflare Tunnel overlay for docker-compose.production.example.yml.
# Use with:
#   CLOUDFLARE_TUNNEL_TOKEN=... \
#   LINGOVECTOR_ENV_FILE=.env.staging \
#   docker compose --env-file .env.staging \
#     -f docker-compose.production.example.yml \
#     -f docker-compose.cloudflare.example.yml up -d
#
# Do not commit real tunnel tokens. Configure a single public hostname in
# Cloudflare Zero Trust with ordered path routing:
#   https://lingovector.kotori9.run/api/*  -> http://api:${API_PORT:-8080}
#   https://lingovector.kotori9.run/*      -> http://web:${WEB_PORT:-3000}
#
# The /api/* rule must be listed before the web fallback rule. Cloudflare Tunnel
# does not need to strip /api because the Axum backend serves routes under /api.
# In the Cloudflare dashboard, substitute the actual container ports from your
# .env file; token-managed tunnels do not expand Compose env vars in dashboard
# public-hostname service URLs.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN outside git}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
